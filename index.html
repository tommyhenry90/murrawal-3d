<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>8A Murrawal Road – 3D model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dde3e0; --scene:#dde3e0; --panel:rgba(246,248,247,.9); --text:#17242b; --muted:#5d6b70;
  --border:rgba(23,36,43,.12); --seg:#e6ebe9; --on:#1d5866; --on-text:#ffffff;
  --label-bg:rgba(250,251,250,.95); --label-text:#17242b; --label-sub:#5f6d72; --shadow:0 8px 28px rgba(23,36,43,.14);
  --ctrl-h:96px;   /* measured from the real control bar in resize() */
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16222a; --scene:#16222a; --panel:rgba(30,43,51,.9); --text:#e4ece9; --muted:#9db0b4;
    --border:rgba(228,236,233,.12); --seg:#22323b; --on:#7cc0c9; --on-text:#0f1c22;
    --label-bg:rgba(28,40,48,.94); --label-text:#e4ece9; --label-sub:#9fb1b5; --shadow:0 8px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16222a; --scene:#16222a; --panel:rgba(30,43,51,.9); --text:#e4ece9; --muted:#9db0b4;
  --border:rgba(228,236,233,.12); --seg:#22323b; --on:#7cc0c9; --on-text:#0f1c22;
  --label-bg:rgba(28,40,48,.94); --label-text:#e4ece9; --label-sub:#9fb1b5; --shadow:0 8px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;padding:3px 8px 4px;border-radius:7px;background:var(--label-bg);color:var(--label-text);border:1px solid var(--border);font-size:11.5px;line-height:1.15;font-weight:600;white-space:nowrap;text-align:center;will-change:transform;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.lbl small{display:block;font-size:10.5px;font-weight:500;color:var(--label-sub);font-variant-numeric:tabular-nums;margin-top:1px}
#labels.compact small{display:none}
#labels.compact .minor{display:none !important}
#hud{position:absolute;top:12px;left:16px;right:16px;pointer-events:none}
#hud h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
#hud p{margin:3px 0 0;font-size:12.5px;color:var(--muted);font-weight:500}
#hint{position:absolute;top:62px;left:16px;font-size:12px;font-weight:500;color:var(--muted);pointer-events:none;transition:opacity .5s}
#hint.gone{opacity:0}
#controls{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(calc(100% - 20px),440px);display:flex;flex-direction:column;gap:7px;padding:7px;background:var(--panel);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.row{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.seg{display:flex;flex:1;background:var(--seg);border-radius:12px;padding:3px;gap:2px}
.seg button,.chip{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border-radius:9px;padding:8px 4px;flex:1;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background-color .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--on);color:var(--on-text)}
.chip{flex:0 0 auto;background:var(--seg);padding:8px 11px;border-radius:12px}
.chip[aria-pressed="true"]{background:var(--on);color:var(--on-text)}
.chip:disabled{opacity:.4;cursor:default}
.seg button:focus-visible,.chip:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.err{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);font-size:14px}
#walk{position:absolute;inset:0;pointer-events:none;display:none}
#walk.on{display:block}
#stick{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);pointer-events:auto;touch-action:none;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--on);box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkbar{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:170px;display:flex;flex-direction:column;gap:7px;padding:7px;pointer-events:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#goto{font:inherit;font-size:14px;font-weight:600;color:var(--text);background:var(--seg);border:0;border-radius:10px;padding:9px 10px;width:100%}
#walkbar .chip{width:100%;padding:9px 10px}
#sims{position:absolute;top:12px;right:16px;width:206px;padding:9px;border-radius:14px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#simTabs{display:flex;flex-wrap:wrap;gap:4px}
.simtab{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--seg);border-radius:8px;padding:5px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.simtab.on,.simtab[aria-pressed="true"]{background:var(--on);color:var(--on-text)}
#simHead{display:flex;align-items:center;gap:5px;margin:8px 0 7px}
#simStatus{margin:0;flex:1;font-size:11px;font-weight:500;color:var(--muted);min-height:14px}
#simToggle{appearance:none;-webkit-appearance:none;border:0;background:var(--seg);color:var(--muted);
  font:inherit;font-size:11px;line-height:1;border-radius:7px;padding:5px 7px;cursor:pointer;flex:0 0 auto;
  -webkit-tap-highlight-color:transparent;transition:transform .18s}
#sims.shut #simBody{display:none}
#sims.shut #simToggle{transform:rotate(-90deg)}
#sims.shut #simHead{margin-bottom:0}
.need{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.need span{flex:0 0 50px;font-size:10.5px;font-weight:600;color:var(--muted)}
.need i{flex:1;height:7px;border-radius:4px;background:var(--seg);overflow:hidden}
.need i b{display:block;height:100%;width:0;border-radius:4px;background:var(--on);transition:width .25s linear}
.need i b.low{background:#c6613f}
#simActs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
#simActs button{appearance:none;-webkit-appearance:none;border:0;font:inherit;font-size:11.5px;font-weight:600;color:var(--on-text);background:var(--on);border-radius:8px;padding:6px 9px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#btnFree{flex:0 0 auto;font-size:10.5px;padding:4px 7px}
.simtab:focus-visible,#simActs button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
/* phones: the panel becomes a slim sheet sitting just above the view controls, not beside them */
@media (max-width:620px){
  #sims{top:auto;left:10px;right:10px;width:auto;bottom:calc(var(--ctrl-h) + 16px);padding:7px 8px;border-radius:13px}
  #simTabs{flex-wrap:nowrap;overflow-x:auto;gap:5px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #simTabs::-webkit-scrollbar{display:none}
  .simtab{flex:0 0 auto}
  #simHead{margin:6px 0 5px}
  #simNeeds{display:flex;gap:7px}
  .need{flex:1;display:block;margin:0}
  .need span{display:block;flex:none;font-size:9px;line-height:1.1;margin-bottom:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .need i{width:100%;height:6px}
  #simActs{flex-wrap:nowrap;overflow-x:auto;gap:5px;margin-top:7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #simActs::-webkit-scrollbar{display:none}
  #simActs button{flex:0 0 auto;padding:6px 10px}
  #controls{padding:5px;gap:5px;border-radius:15px;bottom:8px}
  .seg{padding:2px;border-radius:11px}
  .seg button,.chip{font-size:12.5px;padding:7px 3px}
  .chip{padding:7px 9px}
  #hud{top:10px;left:12px;right:12px}
  #hud h1{font-size:16px}
  #hint{top:54px;left:12px;font-size:11.5px}
}
/* short screens, mostly landscape phones: the scene has almost no height to spare */
@media (max-height:560px){
  #hud p,#hint{display:none}
  #hud h1{font-size:15px}
  #controls{bottom:6px;flex-direction:row;width:min(calc(100% - 16px),780px);align-items:stretch}
  #controls > .seg,#controls > .row{flex:1 1 auto}
  #sims{top:8px;bottom:auto;left:auto;right:8px;width:188px;
    max-height:calc(100% - 86px);overflow-y:auto;padding:7px}
  #simTabs{flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none}
  #simTabs::-webkit-scrollbar{display:none}
  .simtab{flex:0 0 auto}
  #simNeeds{display:flex;gap:6px}
  .need{flex:1;display:block;margin:0}
  .need span{display:block;flex:none;font-size:9px;line-height:1.1;margin-bottom:2px}
  .need i{width:100%;height:5px}
  #simActs{margin-top:6px}
}
/* walk mode on a phone: a thumb-sized stick, a compact bar, and no page panning while you look */
#stage.walking canvas{touch-action:none}
#walkbar .chip[aria-pressed="true"]{background:var(--on);color:var(--on-text)}
@media (max-width:620px){
  #stick{width:118px;height:118px}
  #knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  #walkbar{width:148px;padding:6px;gap:6px}
  #goto,#walkbar .chip{font-size:13px;padding:8px 9px}
}
@media (max-height:560px){
  #stick{width:96px;height:96px;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #knob{width:42px;height:42px;margin:-21px 0 0 -21px}
  #walkbar{flex-direction:row;align-items:center;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #goto{width:auto;min-width:116px}
  #walkbar .chip{width:auto;white-space:nowrap}
}
@media (prefers-reduced-motion: reduce){ #hint{transition:none} .need i b{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels" aria-hidden="true"></div>
  <header id="hud">
    <h1>8A Murrawal Road</h1>
    <p>Stanwell Park · proposed furniture · walk through it from the Walk tab</p>
  </header>
  <div id="hint">Drag to orbit, pinch to zoom, two fingers to pan</div>
  <aside id="sims" hidden>
    <div id="simTabs"></div>
    <div id="simHead">
      <p id="simStatus"></p>
      <button type="button" class="simtab" id="btnFree">Free will</button>
      <button type="button" id="simToggle" aria-expanded="true" aria-label="Hide details">▾</button>
    </div>
    <div id="simBody">
      <div id="simNeeds"></div>
      <div id="simActs"></div>
    </div>
  </aside>
  <nav id="controls" aria-label="View controls">
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-mode="exterior">Exterior</button>
      <button type="button" data-mode="interior">Roof off</button>
      <button type="button" data-mode="cutaway">Cutaway</button>
      <button type="button" data-mode="walk">Walk</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Floors">
        <button type="button" data-floor="all">All</button>
        <button type="button" data-floor="ground">Upper</button>
        <button type="button" data-floor="lower">Flat</button>
      </div>
      <button type="button" class="chip" id="btnPlay">Play</button>
      <button type="button" class="chip" id="btnLabels">Labels</button>
      <button type="button" class="chip" id="btnTop">Plan</button>
      <button type="button" class="chip" id="btnReset" aria-label="Reset view">↺</button>
    </div>
  </nav>
  <div id="walk">
    <div id="stick" aria-label="Move"><div id="knob"></div></div>
    <div id="walkbar">
      <select id="goto" aria-label="Go to">
        <option value="front">Front path</option>
        <option value="entry">Entry</option>
        <option value="dining">Dining</option>
        <option value="lounge" selected>Lounge</option>
        <option value="kitchen">Kitchen</option>
        <option value="deck">Balcony</option>
        <option value="master">Master</option>
        <option value="bed2">Bed 2</option>
        <option value="bed3">Bed 3</option>
        <option value="flat">Flat</option>
        <option value="studio">Studio</option>
        <option value="garage">Garage</option>
        <option value="yard">Back yard</option>
      </select>
      <button type="button" class="chip" id="btnRun" aria-pressed="false">Run</button>
      <button type="button" class="chip" id="btnExitWalk">Exit walk</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const labelLayer = document.getElementById('labels');
  const hint = document.getElementById('hint');

  if (!window.THREE || !THREE.OrbitControls) {
    stage.innerHTML = '<div class="err">The 3D viewer didn’t load. Check your connection and reload the page.</div>';
    return;
  }

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled = true;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 600);
  camera.position.set(-10, 30, 40);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 3;
  controls.maxDistance = 150;
  controls.screenSpacePanning = true;
  controls.target.set(13.5, 2.4, 6.5);

  scene.add(new THREE.HemisphereLight(0xf3f6f8, 0x707763, 0.56));
  const sun = new THREE.DirectionalLight(0xfff2e0, 0.72);
  sun.position.set(-16, 36, -21);
  sun.target.position.set(6, 0, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 130 });
  sun.shadow.bias = -0.0004;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  const fill = new THREE.DirectionalLight(0xdde8f0, 0.28);
  fill.position.set(45, 20, 45);
  scene.add(fill);

  // ---------- procedural textures (sized in metres via world-space UVs) ----------
  const caps = renderer.capabilities;
  const ANISO = caps && caps.getMaxAnisotropy ? Math.min(8, caps.getMaxAnisotropy()) : 1;
  let seed = 20261021;
  const rnd = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const rgb = (c, j) => {
    const d = (rnd() - 0.5) * 2 * (j || 0);
    return 'rgb(' + c.map(v => Math.max(0, Math.min(255, Math.round(v + d)))).join(',') + ')';
  };
  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext && c.getContext('2d');
    if (g) draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = ANISO;
    return t;
  }
  function tex(w, h, su, sv, draw) {
    const t = canvasTex(w, h, draw);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(1 / su, 1 / sv);
    return t;
  }
  function speckle(g, w, h, n, colors, a0, a1, s0 = 1, s1 = 2) {
    for (let i = 0; i < n; i++) {
      g.globalAlpha = a0 + rnd() * (a1 - a0);
      g.fillStyle = colors[(rnd() * colors.length) | 0];
      const s = s0 + rnd() * (s1 - s0);
      g.fillRect(rnd() * w, rnd() * h, s, s);
    }
    g.globalAlpha = 1;
  }
  function brickTex(pal, mortar, specks) {          // 240 × 86 mm stretcher bond
    return tex(512, 368, 0.96, 0.688, (g, w, h) => {
      g.fillStyle = rgb(mortar); g.fillRect(0, 0, w, h);
      for (let r = 0; r < 8; r++) {
        const off = (r % 2) * 64;
        const cols = [0, 1, 2, 3].map(() => rgb(pal[(rnd() * pal.length) | 0], 9));
        for (let i = -1; i < 4; i++) { g.fillStyle = cols[(i + 4) % 4]; g.fillRect(i * 128 + off + 3, r * 46 + 3, 122, 40); }
      }
      speckle(g, w, h, 2600, specks, 0.08, 0.3);
    });
  }
  function plankTex(W, H, su, sv, n, alongV, base, jit, gap, grain, knot) {
    return tex(W, H, su, sv, (g) => {
      let w = W, h = H;
      if (alongV) { g.translate(W, 0); g.rotate(Math.PI / 2); w = H; h = W; }
      const bh = h / n;
      for (let i = 0; i < n; i++) {
        const y = i * bh, j = rnd() * w;
        g.fillStyle = rgb(base, jit); g.fillRect(0, y, j, bh);
        g.fillStyle = rgb(base, jit); g.fillRect(j, y, w - j, bh);
        g.strokeStyle = grain; g.lineWidth = 1; g.globalAlpha = 0.09;
        for (let k = 0; k < 6; k++) {
          const yy = y + 3 + rnd() * (bh - 6), ph = rnd() * 6;
          g.beginPath(); g.moveTo(0, yy);
          for (let x = 0; x <= w; x += 24) g.lineTo(x, yy + Math.sin(x * 0.015 + ph) * 1.6);
          g.stroke();
        }
        g.globalAlpha = 1;
        if (knot) for (let k = 0; k < 2; k++) if (rnd() < 0.55) {
          g.globalAlpha = 0.32; g.fillStyle = knot; g.beginPath();
          g.ellipse(rnd() * w, y + bh * (0.3 + rnd() * 0.4), 3 + rnd() * 4, 2 + rnd() * 2, 0, 0, Math.PI * 2);
          g.fill(); g.globalAlpha = 1;
        }
        g.fillStyle = gap; g.fillRect(0, y, w, 2); g.fillRect(j, y, 2, bh);
      }
    });
  }
  function tileTex(W, H, su, sv, nx, ny, base, jit, grout, mottle, bond) {
    return tex(W, H, su, sv, (g) => {
      const tw = W / nx, th = H / ny;
      for (let j = 0; j < ny; j++) {
        const off = bond && (j % 2) ? tw / 2 : 0;
        for (let i = -1; i < nx; i++) { g.fillStyle = rgb(base, jit); g.fillRect(i * tw + off, j * th, tw, th); }
      }
      if (mottle) speckle(g, W, H, mottle, ['#000', '#fff'], 0.03, 0.08, 2, 6);
      g.fillStyle = grout;
      for (let j = 0; j < ny; j++) {
        const off = bond && (j % 2) ? tw / 2 : 0;
        g.fillRect(0, j * th, W, 2);
        for (let i = -1; i <= nx; i++) g.fillRect(i * tw + off, j * th, 2, th);
      }
    });
  }
  function concreteTex(base, size) {
    return tex(512, 512, size, size, (g, w, h) => {
      g.fillStyle = rgb(base); g.fillRect(0, 0, w, h);
      for (let i = 0; i < 60; i++) {
        g.globalAlpha = 0.012 + rnd() * 0.022; g.fillStyle = rnd() < 0.5 ? '#000' : '#fff';
        g.beginPath(); g.arc(rnd() * w, rnd() * h, 10 + rnd() * 60, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      speckle(g, w, h, 3000, ['#000', '#fff'], 0.05, 0.14);
      g.fillStyle = 'rgba(60,60,60,0.5)'; g.fillRect(0, 0, w, 2); g.fillRect(0, 0, 2, h);
    });
  }

  const TX = {
    brickCream: brickTex([[228, 214, 188], [220, 204, 176], [234, 223, 199], [214, 198, 170]], [237, 231, 217], ['#8a7a60', '#ffffff', '#b8a07a']),
    brickDark: brickTex([[78, 48, 42], [92, 58, 46], [64, 42, 38], [104, 66, 50], [70, 46, 44]], [146, 138, 126], ['#000000', '#c8a080', '#2a1a16']),
    cladding: tex(256, 256, 0.9, 0.9, (g, w, h) => {      // white vertical-joint cladding
      g.fillStyle = '#f3f2ee'; g.fillRect(0, 0, w, h);

  // Occupancy grid: a cell is walkable if it is floor and no solid overlaps the walking band.
  // Solids are inflated by the sim's radius, so a cell is a legal position for a sim's centre.
  function buildNav(lvl, baseY) {
    const fl = NAV.floors.filter(f => f.lvl === lvl);
    let X0 = Infinity, X1 = -Infinity, Z0 = Infinity, Z1 = -Infinity;
    for (const f of fl) { X0 = Math.min(X0, f.x0); X1 = Math.max(X1, f.x1); Z0 = Math.min(Z0, f.z0); Z1 = Math.max(Z1, f.z1); }
    const ox = X0 - CELL, oz = Z0 - CELL;
    const nx = Math.ceil((X1 - ox) / CELL) + 1, nz = Math.ceil((Z1 - oz) / CELL) + 1;
    const walk = new Uint8Array(nx * nz);
    const each = (x0, x1, z0, z1, fn) => {
      const i0 = Math.max(0, Math.ceil((x0 - ox) / CELL - 0.5)), i1 = Math.min(nx - 1, Math.floor((x1 - ox) / CELL - 0.5));
      const j0 = Math.max(0, Math.ceil((z0 - oz) / CELL - 0.5)), j1 = Math.min(nz - 1, Math.floor((z1 - oz) / CELL - 0.5));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) fn(j * nx + i);
    };
    for (const f of fl) each(f.x0, f.x1, f.z0, f.z1, k => { walk[k] = 1; });
    const lo = baseY + 0.2, hi = baseY + 1.0;   // knee to chest: clears floor steps, catches furniture and window sills
    for (const b of NAV.blocks) {
      if (b.y1 <= lo || b.y0 >= hi) continue;
      // walls get a full body's clearance; furniture half, so a sim can slip between a chair and a table
      const r = b.hard ? SIM_R : SOFT_R;
      each(b.x0 - r, b.x1 + r, b.z0 - r, b.z1 + r, k => { walk[k] = 0; });
    }
    return { ox, oz, nx, nz, walk, y: baseY,
      ci: x => Math.round((x - ox) / CELL - 0.5), cj: z => Math.round((z - oz) / CELL - 0.5),
      wx: i => ox + (i + 0.5) * CELL, wz: j => oz + (j + 0.5) * CELL };
  }

  function nearestCell(nav, i, j) {
    const ok = (a, b) => a >= 0 && b >= 0 && a < nav.nx && b < nav.nz && nav.walk[b * nav.nx + a];
    if (ok(i, j)) return j * nav.nx + i;
    for (let r = 1; r < 45; r++) for (let d = -r; d <= r; d++) {
      if (ok(i + d, j - r)) return (j - r) * nav.nx + i + d;
      if (ok(i + d, j + r)) return (j + r) * nav.nx + i + d;
      if (ok(i - r, j + d)) return (j + d) * nav.nx + i - r;
      if (ok(i + r, j + d)) return (j + d) * nav.nx + i + r;
    }
    return -1;
  }

  function aStar(nav, s, t) {
    if (s < 0 || t < 0) return null;
    if (s === t) return [s];
    const nx = nav.nx, n = nx * nav.nz;
    const g = new Float32Array(n).fill(Infinity), f = new Float32Array(n).fill(Infinity);
    const prev = new Int32Array(n).fill(-1), closed = new Uint8Array(n), heap = [];
    const tx = t % nx, tz = (t / nx) | 0;
    const h = k => { const a = Math.abs(k % nx - tx), b = Math.abs(((k / nx) | 0) - tz); return a + b + (Math.SQRT2 - 2) * Math.min(a, b); };
    const swap = (a, b) => { const v = heap[a]; heap[a] = heap[b]; heap[b] = v; };
    const push = v => { heap.push(v); let c = heap.length - 1; while (c) { const p = (c - 1) >> 1; if (f[heap[p]] <= f[heap[c]]) break; swap(p, c); c = p; } };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) { heap[0] = last; let p = 0; for (;;) { const l = 2 * p + 1, r = l + 1; let m = p;
        if (l < heap.length && f[heap[l]] < f[heap[m]]) m = l;
        if (r < heap.length && f[heap[r]] < f[heap[m]]) m = r;
        if (m === p) break; swap(p, m); p = m; } }
      return top;
    };
    g[s] = 0; f[s] = h(s); push(s);
    let guard = 0;
    while (heap.length && guard++ < 250000) {
      const c = pop();
      if (c === t) { const path = []; for (let k = t; k >= 0; k = prev[k]) path.push(k); return path.reverse(); }
      if (closed[c]) continue;
      closed[c] = 1;
      const ci = c % nx, cj = (c / nx) | 0;
      for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
        if (!di && !dj) continue;
        const ai = ci + di, aj = cj + dj;
        if (ai < 0 || aj < 0 || ai >= nx || aj >= nav.nz) continue;
        const a = aj * nx + ai;
        if (!nav.walk[a] || closed[a]) continue;
        if (di && dj && (!nav.walk[cj * nx + ai] || !nav.walk[aj * nx + ci])) continue;   // no squeezing through corners
        const ng = g[c] + (di && dj ? Math.SQRT2 : 1);
        if (ng < g[a]) { g[a] = ng; f[a] = ng + h(a); prev[a] = c; push(a); }
      }
    }

      planTo(s, 'l', m.pos.x + Math.cos(a) * r, m.pos.z + Math.sin(a) * r);
      return;
    }
    const nav = NAVG.l;
    for (let k = 0; k < 60; k++) {
      const c = (Math.random() * nav.walk.length) | 0;
      const z = nav.wz((c / nav.nx) | 0);
      if (nav.walk[c] && z > 11.9) { planTo(s, 'l', nav.wx(c % nav.nx), z); return; }   // out on the grass
    }
  }
  function fetchStep(s) {
    if (s.path) return;
    const p = byName(s.fetchWith);
    if (p) {
      if (s.fetchLeg === 'out') {                   // after the ball
        const a = Math.random() * Math.PI * 2, r = 4 + Math.random() * 4;
        if (planTo(s, p.level, p.pos.x + Math.cos(a) * r, p.pos.z + Math.sin(a) * r)) { s.fetchLeg = 'back'; return; }
      } else if (planTo(s, p.level, p.pos.x + 0.7, p.pos.z + 0.3)) {   // bring it back
        s.fetchLeg = 'out'; s.fetchLeft--; return;
      }
    }
    s.fetchLeft = 0;
  }
  function startFetch(s) {
    const pool = SIMS.filter(p => p.kind === 'person' && !p.pose && levelShown(p.level));
    if (!pool.length) return;
    s.fetchWith = pool[(Math.random() * pool.length) | 0].name;
    s.fetchLeg = 'out'; s.fetchLeft = 2 + ((Math.random() * 3) | 0);
    fetchStep(s);
  }

  function stepSim(s, dt) {
    if (s.kind === 'person') for (const n of NEEDS) s.needs[n.k] = clamp01(s.needs[n.k] - dt * n.rate);
    else {
      if (!s.path) s.phase += dt * 1.6;             // idle tail
      if (s.zoom > 0) s.zoom -= dt;
      if (s.playCool > 0) s.playCool -= dt;
      if (s.play > 0) {
        s.play -= dt;
        if (s.zoomies && s.zoom <= 0 && Math.random() < dt * 0.35) s.zoom = 1.0 + Math.random() * 1.4;
        if (s.play <= 0) s.playCool = 70 + Math.random() * 110;
      }
    }
    if (s.timer > 0) {
      s.timer -= dt;
      if (s.goal) s.needs[s.goal.need] = clamp01(s.needs[s.goal.need] + dt / s.goal.secs);
      if (s.pose && s.pose.t === 'lift') s.phase += dt * 2.6;
      if (s.timer <= 0) { release(s); s.goal = null; s.pose = null; }
      return;
    }
    if (s.path) {
      const t = s.path[s.pi], dx = t.x - s.pos.x, dz = t.z - s.pos.z, d = Math.hypot(dx, dz);
      if (d > 1e-4) s.face = Math.atan2(dx, dz);
      const step = (s.kind === 'dog' ? SPEED * s.speed * (s.zoom > 0 ? 5 : s.eager ? 2.4 : 1) : SPEED) * dt;
      if (d <= step) {
        s.pos.x = t.x; s.pos.z = t.z;
        if (t.y !== undefined) s.y = t.y;
        if (++s.pi >= s.path.length) {
          s.path = null;
          if (s.crossTo) { s.level = s.crossTo; s.crossTo = null; s.y = NAVG[s.level].y; }
          nextStep(s);
        }
      } else {
        const k = step / d;
        s.pos.x += dx * k; s.pos.z += dz * k;
        if (t.y !== undefined) s.y += (t.y - s.y) * k;      // ride the stair down rather than drop off it
      }
      s.phase += dt * (s.kind === 'dog' ? 13 : 8.5);
      return;
    }
    if (!state.freeWill) return;
    if (s.kind === 'dog') {
      // your person just sat down: go and sit with them
      if (s.rest <= 0 && !s.nap) {
        const beside = sofaBeside(s);
        if (beside) {
          s.nap = beside; beside.taken = s;
          s.eager = true;                            // the one thing worth hurrying for
          if (!planTo(s, beside.level, beside.go[0], beside.go[1])) wake(s);
          return;
        }
      }
      if (s.rest > 0) { s.rest -= dt; if (s.rest <= 0) wake(s); return; }
      if (s.play > 0) { if (!s.path) chase(s); return; }
      if (s.fetchLeft > 0) { fetchStep(s); return; }
      if (Math.random() > dt * 0.6 * s.restless) return;
      if (s.zoomies && s.zoom <= 0 && Math.random() < 0.05) s.zoom = 1.0 + Math.random() * 1.2;
      const mate = s.playmate && byName(s.playmate);
      if (mate && s.playCool <= 0 && mate.playCool <= 0 && mate.play <= 0 && mate.rest <= 0 && !mate.nap && Math.random() < 0.35) {
        const secs = 22 + Math.random() * 25;
        wake(s); wake(mate);
        s.play = secs; mate.play = secs;
        s.playCool = 0; mate.playCool = 0;
        chase(s); chase(mate);
        return;
      }
      if (s.fetch && Math.random() < 0.3) { startFetch(s); if (s.fetchLeft > 0) return; }
      let best = null, bd = Infinity;
      const bonded = s.bond && byName(s.bond);
      if (bonded && Math.random() < 0.8) { best = bonded; bd = Math.hypot(bonded.pos.x - s.pos.x, bonded.pos.z - s.pos.z); }
      else for (const p of SIMS) {
        if (p.kind !== 'person' || p.level !== s.level) continue;
        const d = Math.hypot(p.pos.x - s.pos.x, p.pos.z - s.pos.z);
        if (d < bd) { bd = d; best = p; }
      }
      if (best && (bd > 1.4 || best.level !== s.level) && Math.random() < s.follow) {
        s.eager = best === bonded;               // a slow dog still hurries to catch up with its person
        planTo(s, best.level, best.pos.x, best.pos.z);
      }
      else if (Math.random() < s.laze) {
        const free = NAPS.filter(n => n.level === s.home && (!n.taken || n.taken === s));
        if (free.length) {
          const n = free[(Math.random() * free.length) | 0];
          s.nap = n; n.taken = s;
          if (!planTo(s, n.level, n.go[0], n.go[1])) wake(s);
        } else { s.rest = 6 + Math.random() * 16; s.lying = true; }   // every sofa taken: floor it is
      }
      else wander(s);
      return;
    }
    // set off earlier than you might think: crossing the property takes 20 seconds or more
    let worst = null;
    for (const n of NEEDS) if (s.needs[n.k] < 0.45 && (!worst || s.needs[n.k] < s.needs[worst.k])) worst = n;
    if (worst) {
      const a = pickAct(s, worst.k);
      if (a) { sendTo(s, a); return; }
      if (Math.random() < dt * 0.3) wander(s, true);   // queueing for it: stay on this level
      return;
    }
    if (Math.random() < dt * 0.12) wander(s);
  }

  function poseSim(s) {
    const nav = NAVG[s.level], p = s.pose;
    if (!s.crossTo) s.y = nav.y;
    s.g.visible = state.play && levelShown(s.level);
    if (s.bar) s.bar.visible = !!(p && p.t === 'lift');
    s.bob.visible = s === SIMS[state.sim];
    s.bob.rotation.y += 0.025;
    if (s.kind === 'dog') {
      s.g.position.set(s.pos.x, s.y, s.pos.z);
      s.g.rotation.y = s.face;
      if (s.lying && !s.path) {
        if (s.nap) { s.g.position.set(s.nap.x, nav.y + s.nap.y - 0.15, s.nap.z); s.g.rotation.y = s.nap.face; }
        s.body.position.y = -0.26;
        s.legs.forEach(l => { l.rotation.x = 1.4; });
        s.tail.rotation.y = Math.sin(s.phase * 0.5) * 0.2;
      } else {
        const sw = s.path ? Math.sin(s.phase) * 0.6 : 0;
        s.legs[0].rotation.x = sw; s.legs[1].rotation.x = -sw;
        s.legs[2].rotation.x = -sw; s.legs[3].rotation.x = sw;
        s.tail.rotation.y = Math.sin(s.phase * (s.path ? 1 : 0.6)) * 0.55;
        s.body.position.y = s.path ? Math.abs(Math.sin(s.phase)) * 0.02 : 0;
      }
      return;
    }
    if (p && p.t === 'lie') {
      s.g.position.set(p.x, nav.y + (p.dy || 0), p.z);
      s.g.rotation.y = p.face;
      s.body.position.set(0, p.y, 0.85);              // origin is at the feet; the head lands 1.66 m along -z
      s.body.rotation.x = -Math.PI / 2;
      s.legs.forEach(l => { l.rotation.x = 0; });
      s.arms.forEach(l => { l.rotation.x = 0; });
    } else if (p && p.t === 'lift') {
      s.g.position.set(p.x, nav.y + (p.dy || 0), p.z);
      s.g.rotation.y = p.face;
      s.body.position.set(0, -0.05 + Math.sin(s.phase) * 0.045, 0);   // dip and drive
      s.body.rotation.x = 0;
      s.legs.forEach(l => { l.rotation.x = 0; });
      const lift = -1.75 + Math.sin(s.phase) * 0.95;
      s.arms.forEach(l => { l.rotation.x = lift; });
    } else if (p && p.t === 'sit') {
      s.g.position.set(p.x, nav.y + (p.dy || 0), p.z);
      s.g.rotation.y = p.face;
      s.body.position.set(0, -0.35, 0);
      s.body.rotation.x = 0;
      s.legs.forEach(l => { l.rotation.x = -1.4; });
      s.arms.forEach(l => { l.rotation.x = -0.25; });
    } else {
      const sw = s.path ? Math.sin(s.phase) * 0.55 : 0;
      s.g.position.set(s.pos.x, s.y, s.pos.z);
      s.g.rotation.y = (p && !s.path && p.face !== undefined) ? p.face : s.face;
      s.body.position.set(0, s.path ? Math.abs(Math.sin(s.phase)) * 0.035 : 0, 0);
      s.body.rotation.x = 0;
      s.legs[0].rotation.x = sw; s.legs[1].rotation.x = -sw;
      s.arms[0].rotation.x = -sw * 0.8; s.arms[1].rotation.x = sw * 0.8;
    }
  }

  // ---------- play UI ----------
  const btnPlay = document.getElementById('btnPlay');
  const panel = document.getElementById('sims');
  const elTabs = document.getElementById('simTabs'), elStatus = document.getElementById('simStatus');
  const elNeeds = document.getElementById('simNeeds'), elActs = document.getElementById('simActs');
  const btnFree = document.getElementById('btnFree');
  const btnToggle = document.getElementById('simToggle');
  const narrow = () => window.innerWidth <= 620 || window.innerHeight <= 560;
  let bars = [];

  function buildPanel() {
    elTabs.innerHTML = SIMS.map((s, i) =>
      '<button type="button" class="simtab' + (i === state.sim ? ' on' : '') + '" data-sim="' + i + '">' + s.name + '</button>').join('');
    const active = elTabs.children[state.sim];
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const s = SIMS[state.sim];
    if (s.kind === 'dog') { elNeeds.innerHTML = ''; elActs.innerHTML = ''; bars = []; }
    else {
      elNeeds.innerHTML = NEEDS.map(n => '<div class="need"><span>' + n.label + '</span><i><b></b></i></div>').join('');
      bars = [].slice.call(elNeeds.querySelectorAll('b'));
      const seen = {};
      elActs.innerHTML = actsFor(s.home, s.name).filter(a => !seen[a.label] && (seen[a.label] = 1))
        .map(a => '<button type="button" data-act="' + ACTS.indexOf(a) + '">' + a.label + '</button>').join('');
    }

  }
  function tickPanel() {
    const s = SIMS[state.sim];
    if (!s) return;
    if (s.kind === 'person') NEEDS.forEach((n, i) => {
      if (!bars[i]) return;
      const v = s.needs[n.k];
      bars[i].style.width = (v * 100).toFixed(0) + '%';
      bars[i].className = v < 0.3 ? 'low' : '';
    });
    elStatus.textContent = !levelShown(s.level) ? s.name + ' is out of view'
      : s.timer > 0 ? s.name + ' — ' + (s.goal ? s.goal.label.toLowerCase() : 'busy')
      : s.play > 0 ? s.name + ' — playing with ' + s.playmate + (s.zoom > 0 ? ', zoomies!' : '')
      : s.fetchLeft > 0 ? s.name + (s.fetchLeg === 'back' ? ' — fetching' : ' — after the ball')
      : s.path ? s.name + (s.kind === 'dog' ? (s.zoom > 0 ? ' — zoomies!' : ' — trotting') : ' — walking')
      : s.lying ? s.name + (s.nap ? ' — asleep on ' + s.nap.label : ' — flopped')
      : s.name + ' — idle';
  }
  elTabs.addEventListener('click', e => {
    const b = e.target.closest('[data-sim]');
    if (b) { state.sim = +b.dataset.sim; buildPanel(); }
  });
  elActs.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const s = SIMS[state.sim], want = ACTS[+b.dataset.act];
    const same = actsFor(s.home, s.name).filter(a => a.label === want.label);
    sendTo(s, freeOf(same, s)[0] || want);
  });
  btnFree.addEventListener('click', () => {
    state.freeWill = !state.freeWill;
    btnFree.setAttribute('aria-pressed', String(state.freeWill));
  });
  btnToggle.addEventListener('click', () => { state.shut = !state.shut; simsApply(); });

  function simsApply() {
    for (const s of SIMS) s.g.visible = state.play;
    panel.hidden = !state.play || state.mode === 'walk';
    panel.classList.toggle('shut', state.shut);
    btnToggle.setAttribute('aria-expanded', String(!state.shut));
    btnToggle.setAttribute('aria-label', state.shut ? 'Show details' : 'Hide details');
    btnPlay.setAttribute('aria-pressed', String(state.play));
    if (state.play) buildPanel();
  }
  btnPlay.addEventListener('click', () => {
    state.play = !state.play;
    if (state.play && state.mode === 'exterior') state.mode = 'cutaway';
    if (state.play && narrow() && !state.touched) { state.shut = true; state.touched = true; }
    if (state.play) {
      hint.textContent = narrow() ? 'Tap someone, then tap the floor'
        : 'Click someone to select them, then click the floor to send them there';
      hint.classList.remove('gone');
      setTimeout(() => hint.classList.add('gone'), 6000);
    }

  });

  // click to select / send, without stealing orbit drags
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), hitPt = new THREE.Vector3();
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener('pointerup', e => {
    const d = downAt; downAt = null;
    if (!d || !state.play || Math.hypot(e.clientX - d.x, e.clientY - d.y) > 6) return;
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const live = SIMS.filter(s => levelShown(s.level));
    const hit = ray.intersectObjects(live.map(s => s.g), true)[0];
    if (hit) {
      let o = hit.object;
      while (o && !o.userData.sim) o = o.parent;
      if (o) { state.sim = SIMS.indexOf(o.userData.sim); buildPanel(); return; }
    }
    const s = SIMS[state.sim];
    if (!s || !levelShown(s.level)) return;
    let best = null;
    for (const lvl of LVLS) {                       // nearest walkable surface under the cursor
      const nav = NAVG[lvl];
      if (!levelShown(lvl)) continue;
      if (!ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -nav.y), hitPt)) continue;
      const i = nav.ci(hitPt.x), j = nav.cj(hitPt.z);
      if (i < 0 || j < 0 || i >= nav.nx || j >= nav.nz || !nav.walk[j * nav.nx + i]) continue;
      const dist = hitPt.distanceTo(camera.position);
      if (!best || dist < best.dist) best = { lvl: lvl, x: hitPt.x, z: hitPt.z, dist: dist };
    }
    if (!best) return;
    cancel(s);
    planTo(s, best.lvl, best.x, best.z);
  });

  // ---------- state / UI ----------
  const state = { mode: 'cutaway', floor: 'all', labels: true, play: false, sim: 0, freeWill: true,
    shut: false, touched: false };
  const btnLabels = document.getElementById('btnLabels');
  const btnTop = document.getElementById('btnTop');
  const btnReset = document.getElementById('btnReset');

  function apply() {
    const walk = state.mode === 'walk';
    const ext = state.mode === 'exterior' || walk, cut = state.mode === 'cutaway';
    ground.visible = walk || state.floor !== 'lower';
    lower.visible = walk || state.floor !== 'ground';
    roofMain.visible = ext && (walk || state.floor !== 'lower');
    roofOut.visible = ext;
    ceilings.visible = walk;
    walkFill.intensity = walk ? 0.4 : 0;
    doorPanels.forEach(d => { d.visible = !walk; });
    clip.g.constant = cut ? FFL + 1.35 : 1000;
    clip.o.constant = cut ? UP + 1.35 : 1000;
    clip.l.constant = cut && state.floor === 'lower' ? 1.35 : 1000;
    document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
    document.querySelectorAll('[data-floor]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.floor === state.floor)));
    btnLabels.setAttribute('aria-pressed', String(state.labels));
    btnLabels.disabled = ext;
    simsApply();
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mode === 'walk') { enterWalk(); return; }
    state.mode = b.dataset.mode; apply();
  }));
  document.querySelectorAll('[data-floor]').forEach(b => b.addEventListener('click', () => { state.floor = b.dataset.floor; apply(); }));
  btnLabels.addEventListener('click', () => { state.labels = !state.labels; apply(); });

  const tmp = new THREE.Vector3();
  function updateLabels() {
    const show = state.labels && state.mode !== 'exterior' && state.mode !== 'walk';
    labelLayer.classList.toggle('compact', camera.position.distanceTo(controls.target) > 34);
    for (const L of labels) {
      let vis = show && (L.grp === 'o' || (L.grp === 'g' && state.floor !== 'lower') || (L.grp === 'l' && state.floor === 'lower'));
      if (vis) { tmp.copy(L.pos).project(camera); if (tmp.z > 1 || tmp.z < -1) vis = false; }
      if (!vis) { if (!L.hidden) { L.el.style.display = 'none'; L.hidden = true; } continue; }
      if (L.hidden) { L.el.style.display = ''; L.hidden = false; }
      const x = (tmp.x * 0.5 + 0.5) * W, y = (-tmp.y * 0.5 + 0.5) * H;
      L.el.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) translate(-50%,-50%)';
    }
  }

  // ---------- camera framing ----------
  let W = 1, H = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    const ctrl = document.getElementById('controls');
    if (ctrl) document.documentElement.style.setProperty('--ctrl-h', ctrl.offsetHeight + 'px');
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    if (state.mode === 'walk') camera.fov = walkFov();
    camera.updateProjectionMatrix();
  }
  // key points of the built form (footprints, deck, stairs, roof ridges) used to frame the camera
  const FRAME_ALL = [[-4.2, 0, -7.8], [15.4, 0, -7.8], [13.7, 0, 19.5], [-5.2, 0, 19.5], [3, 7.3, 7], [9, 7.3, 7], [12, 5, -4]];
  const FRAME_TIGHT = [[-3.9, 0, -7.0], [14.7, 0, -7.0], [12.5, 0, 14.4], [-3.9, 0, 14.4], [3, 7.3, 7], [9, 7.3, 7]];
  function viewFor(kind) {
    const portrait = camera.aspect < 0.85;
    const corners = (portrait ? FRAME_TIGHT : FRAME_ALL).map(p => new THREE.Vector3(p[0], p[1], p[2]));
    const bb = new THREE.Box3().setFromPoints(corners);
    const center = new THREE.Vector3();
    bb.getCenter(center); center.y = 2.4;
    let dir;
    if (kind === 'top') dir = new THREE.Vector3(0, 1, 0.0008);
    else dir = portrait ? new THREE.Vector3(-0.75, 0.8, 0.85) : new THREE.Vector3(-0.42, 0.72, 0.86);
    dir.normalize();
    const hudH = document.getElementById('hud').offsetHeight + 16;
    const sheetH = (!panel.hidden && narrow()) ? panel.offsetHeight + 10 : 0;   // the sheet sits over the scene
    const ctrlH = document.getElementById('controls').offsetHeight + 22 + sheetH;
    let yTop = 1 - 2 * hudH / H, yBot = -1 + 2 * ctrlH / H;
    if (yTop - yBot < 0.8) { yTop = 0.9; yBot = -0.9; }
    const savedP = camera.position.clone(), savedQ = camera.quaternion.clone();
    let lo = 2, hi = 300;
    for (let k = 0; k < 32; k++) {
      const mid = (lo + hi) / 2;
      camera.position.copy(center).addScaledVector(dir, mid);
      camera.lookAt(center);
      camera.updateMatrixWorld(true);
      let ok = true;
      for (const c of corners) {
        tmp.copy(c).project(camera);
        if (tmp.x < -0.94 || tmp.x > 0.94 || tmp.y < yBot || tmp.y > yTop || tmp.z > 1) { ok = false; break; }
      }
      if (ok) hi = mid; else lo = mid;
    }
    camera.position.copy(savedP); camera.quaternion.copy(savedQ); camera.updateMatrixWorld(true);
    return { pos: center.clone().addScaledVector(dir, hi), tgt: center };
  }
  let tween = null;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function flyTo(v) {
    if (reduceMotion) { camera.position.copy(v.pos); controls.target.copy(v.tgt); return; }
    tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: v.pos, t1: v.tgt, start: performance.now(), ms: 750 };
  }
  btnTop.addEventListener('click', () => flyTo(viewFor('top')));
  btnReset.addEventListener('click', () => flyTo(viewFor('home')));

  const hintTimer = setTimeout(() => hint.classList.add('gone'), 7000);
  controls.addEventListener('start', () => { tween = null; hint.classList.add('gone'); clearTimeout(hintTimer); });

  // ---------- theme ----------
  function applyTheme() {
    const v = getComputedStyle(document.documentElement).getPropertyValue('--scene').trim();
    try { scene.background = new THREE.Color(v || '#dde3e0'); } catch (e) { scene.background = new THREE.Color(0xdde3e0); }
  }
  applyTheme();
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
  }
  if (window.MutationObserver) new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- walk-through (first person, eye height 1.62 m) ----------
  const walkUI = document.getElementById('walk'), ctrlPanel = document.getElementById('controls');
  const stick = document.getElementById('stick'), knob = document.getElementById('knob'), gotoSel = document.getElementById('goto');
  const PL = { x: 0, z: 0, floor: 0, camY: 0, yaw: 0, pitch: 0, mx: 0, mz: 0, run: false, keys: {} };
  const EYE = 1.62, RAD = 0.25, STEP = 0.3, RAYS = [0.35, 0.72, 0.97, 1.55];
  const SPOTS = {      // x, z, facing (yaw), level
    front: [3.5, -3.0, Math.PI, UP], entry: [3.6, 1.3, Math.PI, FFL], dining: [5.7, 3.6, -Math.PI / 2, FFL],
    lounge: [8.15, 7.1, -2.4, FFL], kitchen: [6.2, 8.6, Math.PI, FFL], deck: [7.6, 13.6, Math.PI, FFL],
    master: [1.6, 8.6, -2.64, FFL], bed2: [2.85, 6.85, 0.64, FFL], bed3: [5.3, 1.7, -Math.PI / 2, FFL],
    flat: [1.6, 10.0, -Math.PI / 2, 0], studio: [-2.0, 5.0, 0, UP], garage: [11.0, -3.0, 0, UP], yard: [5.0, 18.0, 0, 0],
  };
  const rc = new THREE.Raycaster(), O = new THREE.Vector3(), D = new THREE.Vector3(), DOWN = new THREE.Vector3(0, -1, 0), N = new THREE.Vector3();
  let colliders = null, walkPrev = null, look = null, stickId = null;
  const near = [];
  function buildColliders() {
    if (colliders) return;
    colliders = [];
    [site, ground, lower, outb].forEach(g => g.traverse(o => {
      if (!o.isMesh) return;
      o.updateMatrixWorld(true);
      if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
      colliders.push({ o, s: o.geometry.boundingSphere.clone().applyMatrix4(o.matrixWorld) });
    }));
  }
  function gather(x, z) {
    near.length = 0;
    for (const c of colliders) {
      if (!c.o.visible || c.o.userData.noCollide) continue;
      const dx = c.s.center.x - x, dz = c.s.center.z - z, r = c.s.radius + 2.5;
      if (dx * dx + dz * dz < r * r) near.push(c.o);
    }
  }
  function blocked(dx, dz) {
    const len = Math.hypot(dx, dz);
    if (len < 1e-6) return false;
    D.set(dx / len, 0, dz / len);
    for (const h of RAYS) {
      O.set(PL.x, PL.floor + h, PL.z);
      rc.set(O, D); rc.near = 0; rc.far = len + RAD;
      if (rc.intersectObjects(near, false).length) return true;
    }
    return false;
  }
  function floorAt(x, z, from) {
    O.set(x, from + 0.55, z);
    rc.set(O, DOWN); rc.near = 0; rc.far = 60;
    for (const h of rc.intersectObjects(near, false)) {
      if (!h.face) continue;
      N.copy(h.face.normal).transformDirection(h.object.matrixWorld);
      if (N.y > 0.4) return h.point.y;
    }
    return null;
  }
  function tryMove(dx, dz) {
    if (blocked(dx, dz)) {
      if (Math.abs(dx) > 1e-5 && !blocked(dx, 0)) dz = 0;
      else if (Math.abs(dz) > 1e-5 && !blocked(0, dz)) dx = 0;
      else return;
    }
    const f = floorAt(PL.x + dx, PL.z + dz, PL.floor);
    if (f === null || f > PL.floor + STEP) return;
    PL.x += dx; PL.z += dz; PL.floor = f;
  }
  function goToSpot(key) {
    const s = SPOTS[key] || SPOTS.lounge;
    PL.x = s[0]; PL.z = s[1]; PL.yaw = s[2]; PL.pitch = -0.05;
    gather(PL.x, PL.z);
    const f = floorAt(PL.x, PL.z, s[3]);
    PL.floor = f === null ? s[3] : f; PL.camY = PL.floor + EYE;
    gotoSel.value = key;
  }
  function updateWalk(dt) {
    const k = PL.keys;
    if (k.ArrowLeft) PL.yaw += 1.8 * dt;
    if (k.ArrowRight) PL.yaw -= 1.8 * dt;
    let f = PL.mz + ((k.KeyW || k.ArrowUp) ? 1 : 0) - ((k.KeyS || k.ArrowDown) ? 1 : 0);
    let s = PL.mx + (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0);
    const mag = Math.hypot(f, s);
    if (mag > 1) { f /= mag; s /= mag; }
    if (mag > 0.06) {
      const v = (k.ShiftLeft || k.ShiftRight || PL.run ? 2.6 : 1.4) * dt, sy = Math.sin(PL.yaw), cy = Math.cos(PL.yaw);
      gather(PL.x, PL.z);
      tryMove((-sy * f + cy * s) * v, (-cy * f - sy * s) * v);
    }
    PL.camY += (PL.floor + EYE - PL.camY) * Math.min(1, dt * 10);
    camera.position.set(PL.x, PL.camY, PL.z);
    camera.rotation.set(PL.pitch, PL.yaw, 0, 'YXZ');
  }
  function enterWalk(key) {
    if (state.mode !== 'walk') walkPrev = { mode: state.mode, pos: camera.position.clone(), tgt: controls.target.clone() };
    state.mode = 'walk';
    apply();
    tween = null; controls.enabled = false;
    camera.fov = walkFov(); camera.near = 0.05; camera.updateProjectionMatrix();
    buildColliders();
    goToSpot(key || gotoSel.value || 'lounge');
    ctrlPanel.style.display = 'none'; walkUI.classList.add('on');
    stage.classList.add('walking');
    hint.textContent = narrow() ? 'Drag to look · stick to move'
      : 'Drag to look, use the stick or WASD to move';
    hint.classList.remove('gone');
    clearTimeout(walkHintTimer); walkHintTimer = setTimeout(() => hint.classList.add('gone'), 6000);
  }
  let walkHintTimer = 0;
  function walkFov() {                                   // ~74° across on any screen shape
    const v = 2 * Math.atan(Math.tan(37 * Math.PI / 180) / camera.aspect) * 180 / Math.PI;
    return Math.max(62, Math.min(88, v));
  }
  function exitWalk() {
    state.mode = walkPrev ? walkPrev.mode : 'cutaway';
    apply();
    camera.fov = 42; camera.near = 0.1; camera.rotation.order = 'XYZ'; camera.updateProjectionMatrix();
    if (walkPrev) { camera.position.copy(walkPrev.pos); controls.target.copy(walkPrev.tgt); }
    controls.enabled = true; controls.update();
    PL.keys = {}; PL.mx = PL.mz = 0; look = null; stickId = null; knob.style.transform = '';
    walkUI.classList.remove('on'); ctrlPanel.style.display = '';
    stage.classList.remove('walking');
    PL.run = false; btnRun.setAttribute('aria-pressed', 'false');
    hint.classList.add('gone');
  }
  const btnRun = document.getElementById('btnRun');
  btnRun.addEventListener('click', () => {
    PL.run = !PL.run;
    btnRun.setAttribute('aria-pressed', String(PL.run));
  });
  document.getElementById('btnExitWalk').addEventListener('click', exitWalk);
  gotoSel.addEventListener('change', () => { if (state.mode === 'walk') goToSpot(gotoSel.value); });
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => {
    if (state.mode !== 'walk') return;
    look = { id: e.pointerId, x: e.clientX, y: e.clientY };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    hint.classList.add('gone');
  });
  cv.addEventListener('pointermove', e => {
    if (!look || e.pointerId !== look.id) return;
    PL.yaw -= (e.clientX - look.x) * 0.005;
    PL.pitch = Math.max(-1.3, Math.min(1.3, PL.pitch - (e.clientY - look.y) * 0.005));
    look.x = e.clientX; look.y = e.clientY;
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, e => { if (look && e.pointerId === look.id) look = null; }));
  function moveStick(e) {
    const r = stick.getBoundingClientRect(), max = r.width / 2 - 16;
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    PL.mx = dx / max; PL.mz = -dy / max;
  }
  stick.addEventListener('pointerdown', e => {
    stickId = e.pointerId;
    try { stick.setPointerCapture(e.pointerId); } catch (err) {}
    moveStick(e); e.preventDefault(); hint.classList.add('gone');
  });
  stick.addEventListener('pointermove', e => { if (e.pointerId === stickId) moveStick(e); });
  ['pointerup', 'pointercancel'].forEach(t => stick.addEventListener(t, e => {
    if (e.pointerId !== stickId) return;
    stickId = null; PL.mx = PL.mz = 0; knob.style.transform = '';
  }));
  window.addEventListener('keydown', e => {
    if (state.mode !== 'walk' || e.target === gotoSel) return;
    if (e.code === 'Escape') { exitWalk(); return; }
    PL.keys[e.code] = true;
    if (e.code.indexOf('Arrow') === 0) e.preventDefault();
  });
  window.addEventListener('keyup', e => { PL.keys[e.code] = false; });
  window.addEventListener('blur', () => { PL.keys = {}; });

  // ---------- boot ----------
  resize();
  apply();
  const home = viewFor('home');
  camera.position.copy(home.pos);
  controls.target.copy(home.tgt);
  controls.update();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  else window.addEventListener('resize', resize);

  let lastT = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;
    if (state.mode === 'walk') updateWalk(dt);
    else {
      if (tween) {
        const k = Math.min(1, (now - tween.start) / tween.ms);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        camera.position.lerpVectors(tween.p0, tween.p1, e);
        controls.target.lerpVectors(tween.t0, tween.t1, e);
        if (k >= 1) tween = null;
      }
      controls.update();
    }
    if (state.play) { for (const s of SIMS) { stepSim(s, dt); poseSim(s); } tickPanel(); }
    renderer.render(scene, camera);
    updateLabels();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
